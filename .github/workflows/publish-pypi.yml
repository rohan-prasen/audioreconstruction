name: Publish audioreconstructor to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-audioreconstructor-pypi
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'audioreconstructor-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/audioreconstructor/
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: uv build onnx/cli

      - name: Publish to PyPI
        run: uv publish onnx/cli/dist/* --trusted-publishing always
