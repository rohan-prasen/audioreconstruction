name: Build and deploy audioreconstructor

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Package version to validate (defaults to onnx/cli/pyproject.toml)"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: audioreconstructor-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86 is an asset-label alias for the 64-bit hosted runner. True
          # 32-bit builds are not supported by the ONNX Runtime dependency.
          - name: Linux amd64
            runner: ubuntu-24.04
            asset: audioreconstructor-linux-amd64
          - name: Linux x86
            runner: ubuntu-24.04
            asset: audioreconstructor-linux-x86
          - name: Windows amd64
            runner: windows-2025
            asset: audioreconstructor-windows-amd64.exe
          - name: Windows x86
            runner: windows-2025
            asset: audioreconstructor-windows-x86.exe
          # macOS amd64 is the Apple Silicon/arm64 compatibility label used by
          # the release contract; Intel remains explicitly named separately.
          - name: macOS amd64
            runner: macos-15
            asset: audioreconstructor-macos-amd64
          - name: macOS Intel
            runner: macos-15-intel
            asset: audioreconstructor-macos-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: python -m pip install -r onnx/requirements.txt

      - name: Build one-file binary
        working-directory: onnx
        run: pyinstaller --clean --noconfirm audioreconstructor.spec

      - name: Smoke test binary
        shell: bash
        run: |
          set +e
          binary="onnx/dist/audioreconstructor"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          "$binary" > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          test "$code" -eq 2
          grep -qi "usage:" smoke.log

      - name: Rename binary
        shell: bash
        run: |
          source="onnx/dist/audioreconstructor"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source="${source}.exe"
          fi
          mv "$source" "onnx/dist/${{ matrix.asset }}"

      - name: Make Unix binary executable
        if: runner.os != 'Windows'
        run: chmod +x "onnx/dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: onnx/dist/${{ matrix.asset }}
          if-no-files-found: error

  validate-frontend:
    name: Frontend Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x", "24.x"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Node.js and build frontend
        working-directory: frontend
        run: |
          node --version
          bun install --frozen-lockfile
          bun run lint
          bun run build

  package-release-assets:
    name: Package release assets
    needs: [build-native, validate-frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.release_version || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Resolve package version
        shell: bash
        run: |
          if [[ -z "$RELEASE_VERSION" ]]; then
            RELEASE_VERSION="$(python3 -c 'import pathlib, re; text=pathlib.Path("onnx/cli/pyproject.toml").read_text(); print(re.search(r"^version = \"([^\"]+)\"$", text, re.MULTILINE).group(1))')"
          fi
          if [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.tag_name }}" != "audioreconstructor-v${RELEASE_VERSION}" ]]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match version $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: audioreconstructor-*
          merge-multiple: true

      - name: Add model assets
        run: |
          cp onnx/exported/model.onnx release-assets/model.onnx
          cp onnx/exported/config.json release-assets/config.json

      - name: Generate release manifest
        run: |
          python3 onnx/cli/tools/generate_manifest.py \
            --version "$RELEASE_VERSION" \
            --assets-dir release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: audioreconstructor-release-assets
          path: release-assets
          if-no-files-found: error

      - name: Upload assets to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
