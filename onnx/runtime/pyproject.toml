[project]
name = "audioreconstruction-native"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47",
    "numpy>=1.26",
    "onnxruntime==1.20.1",
    "scipy>=1.15; python_version < '3.11'",
    "scipy>=1.16; python_version >= '3.11'",
    "soundfile>=0.13.1",
]

[dependency-groups]
build = ["pyinstaller>=6.21.0"]

[tool.uv]
package = false
