  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {

  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

// Simplex 2D noise
vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
           -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
  + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
    dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main() {
    vec2 uv = v_texCoord;
    vec2 centered_uv = (uv - 0.5) * 2.0;
    centered_uv.x *= u_resolution.x / u_resolution.y;
    
    float time = u_time * 0.1;
    
    // Moonshot-style "Eclipse/Halo" effect
    // Dark core with a bright, soft bleed on the edge
    float d = length(centered_uv);
    
    // Animate the halo position slightly based on mouse
    vec2 mouse = (u_mouse / u_resolution - 0.5) * 0.2;
    float halo = 1.0 - smoothstep(0.3, 0.6, length(centered_uv + mouse));
    halo *= smoothstep(0.2, 0.5, length(centered_uv + mouse));
    
    // Add noise to the light bleed for that "filmic" organic feel
    float n = snoise(uv * 3.0 + time);
    halo += n * 0.05 * halo;
    
    // Base Void Color
    vec3 color = vec3(0.02, 0.02, 0.03); 
    
    // The Light Bleed (Pure White/Soft Blue)
    vec3 lightColor = vec3(0.9, 0.95, 1.0);
    color = mix(color, lightColor, halo * 0.4);
    
    // Subtle scanline / grain effect
    float grain = fract(sin(dot(uv, vec2(12.9898, 78.233))) * 43758.5453);
    color += grain * 0.02;

  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;

      mouse.y = ny * canvas.height;

    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);

  }
  render(0);
})();
</script>

(function() {

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio || 1);
container.appendChild(renderer.domElement);

// A central "Pulse" core
const group = new THREE.Group();
scene.add(group);

const outerGeom = new THREE.IcosahedronGeometry(1.5, 1);
const outerMat = new THREE.MeshPhongMaterial({ 
    color: 0xffffff, 
    wireframe: true, 
    transparent: true, 
    opacity: 0.1 
});
const outer = new THREE.Mesh(outerGeom, outerMat);
group.add(outer);

// Solid inner core that "pulses"
const innerGeom = new THREE.IcosahedronGeometry(0.8, 0);
const innerMat = new THREE.MeshStandardMaterial({ 
    color: 0xffffff, 
    metalness: 0.5, 
    roughness: 0.1,
    flatShading: true
});
const inner = new THREE.Mesh(innerGeom, innerMat);
group.add(inner);

// Floating data particles
const particlesCount = 100;
const positions = new Float32Array(particlesCount * 3);
for(let i = 0; i < particlesCount; i++) {
    positions[i*3] = (Math.random() - 0.5) * 10;
    positions[i*3+1] = (Math.random() - 0.5) * 10;

pointLight.position.set(5, 5, 5);
scene.add(pointLight);

    const time = Date.now() * 0.001;
    
    group.rotation.y += 0.002;
    group.rotation.z += 0.001;
